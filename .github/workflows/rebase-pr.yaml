# This workflow catches PRs made to 'release' and rebases them onto 'develop'
# when that target branch is available.
#

name: rebase-pr

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - release

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rebase-pr:
    name: Rebase pull request
    runs-on: ubuntu-latest
    steps:
      - name: Perform rebase
        uses: actions/github-script@v8
        with:
          script: |
            const targetBranch = "develop";

            try {
              await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: targetBranch
              });
            } catch (error) {
              if (error.status === 404) {
                core.info(`Skipping rebase: target branch '${targetBranch}' does not exist.`);
                return;
              }
              throw error;
            }

            await github.rest.pulls.update({
              pull_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: targetBranch
            });
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Thanks for your contribution! We don't accept pull requests to the \`release\` branch. I have rebased your pull request onto \`${targetBranch}\`, check for any conflicts.`
            });
